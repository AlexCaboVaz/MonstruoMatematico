<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Monstruo Matemático</title>
<link rel="stylesheet" href="css/styles.css" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#241B44" />
<link rel="icon" href="assets/icons/icon-192.png" />
<link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
</head>
<body>

  <div id="stage">

    <!-- ================= PANTALLA 1: CREACIÓN ================= -->
    <section id="screen-creation" class="screen">
      <div class="creation-card">
        <div class="creation-emoji" id="creation-preview">🟢</div>
        <h1 class="prompt-text">¡Hola! ¿Cómo te llamas?</h1>
        <input
          id="input-nombre"
          class="name-input"
          type="text"
          maxlength="40"
          placeholder="Escribe tu nombre..."
          autocomplete="off"
        />

        <p class="prompt-text prompt-small">Elige el color de tu amigo</p>
        <div class="color-picker" id="color-picker">
          <button class="color-dot" data-color="verde" style="--dot-color:#68D391" aria-label="Verde"></button>
          <button class="color-dot" data-color="azul" style="--dot-color:#4FA8F0" aria-label="Azul"></button>
          <button class="color-dot" data-color="rojo" style="--dot-color:#FF6F6F" aria-label="Rojo"></button>
          <button class="color-dot" data-color="morado" style="--dot-color:#B187F0" aria-label="Morado"></button>
        </div>

        <button id="btn-despertar" class="btn-primary" disabled>¡Despertar! ✨</button>
        <p class="error-text" id="creation-error" hidden></p>
      </div>
    </section>

    <!-- ================= PANTALLA 2: JUEGO ================= -->
    <section id="screen-game" class="screen" hidden>

      <header class="topbar">
        <div class="topbar-left">
          <div class="menu-container">
            <button id="btn-menu" class="btn-menu" type="button" aria-label="Menú">☰</button>
            <div id="menu-dropdown" class="menu-dropdown" hidden>
              <button type="button" id="menu-item-mapa" class="menu-item">🗺️ Mapa de tablas</button>
            </div>
          </div>
          <div class="star-counter">
            <span class="star-icon">⭐</span>
            <span id="star-count">0</span>
          </div>
        </div>
        <div class="level-badge">Tabla del <span id="level-number">1</span></div>
      </header>

      <!-- Mapa de tablas: mundo de niveles ambientado en dragones -->
      <div id="map-overlay" class="map-overlay" hidden>
        <div class="map-box">
          <div class="map-header">
            <p class="map-title">🐉 Mapa de las Tablas</p>
            <button type="button" id="btn-cerrar-mapa" class="map-close" aria-label="Cerrar mapa">✕</button>
          </div>
          <p class="map-subtitle">Elige una tabla para volar hasta allí</p>
          <div id="map-nodes" class="map-nodes"></div>
        </div>
      </div>

      <!-- Pizarra con la operación actual -->
      <div class="chalkboard">
        <div class="chalkboard-frame">
          <p id="operation-text" class="operation-text">? × ? = ?</p>
        </div>
      </div>

      <!-- 3 cartas de opciones -->
      <div id="cards-container" class="cards-container"></div>

      <!-- Multidrake: ilustración real (reposo / comiendo / evolución) -->
      <div class="monster-area">
        <img id="monster-img" class="monster-img" src="assets/multidrake-reposo.png" alt="Multidrake" />
        <p class="monster-name">🐉 Multidrake</p>

        <!-- Recuadro simple y visible para arrastrar la comida -->
        <div id="monster-mouth" class="monster-mouth">
          <span class="monster-mouth-icon">🍽️</span>
          <span class="monster-mouth-text">Arrastra aquí la comida</span>
        </div>
      </div>

      <!-- Botón / panel de la Nevera Mágica -->
      <button id="btn-nevera" class="btn-nevera" hidden>🧊</button>

      <div id="shop-panel" class="shop-panel" hidden>
        <p class="shop-title">Nevera Mágica</p>
        <div id="shop-items" class="shop-items"></div>
        <p class="shop-hint">Toca la comida o arrástrala hasta la boca del monstruo</p>
      </div>

    </section>

  </div>

  <div id="confetti-layer" aria-hidden="true"></div>

  <!-- Diálogo tras evolucionar: elegir cómo seguir, sin saltos bruscos -->
  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal-box">
      <p id="modal-title" class="modal-title"></p>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
